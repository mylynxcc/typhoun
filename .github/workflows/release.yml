# Release automation.
#
# A release is cut by editing the CHANGELOG, not by running a command with a
# version argument: the first section after `Unreleased` names the version, its
# body becomes the release notes, and the tag points at the commit that landed
# on `main`. Turning `## [Unreleased]` into `## [x.y.z] — <date>` and merging is
# therefore the whole procedure.
#
# This waits for `CI` to finish green instead of firing on the push itself, so a
# public release can never be aimed at a commit whose tests have not finished —
# and the suite is not run a second time to find that out.
#
# A manual run can ask for a dry run, which walks the whole publish path — the
# idempotency checks, the tag, the release built from the notes — printing the
# requests it would make instead of sending them. `ci.yml` walks exactly that on
# every push, so the branch which actually publishes is exercised continuously
# rather than discovered by the next release.
#
# Running it twice is safe: the plan step reports `releasable=false` when the
# derived tag already exists, and the publish step refuses to overwrite an
# existing tag or release.
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Walk the publishing path, printing what it would do instead of doing it"
        type: boolean
        default: true

permissions:
  contents: write

# Two merges close together must not race to create the same tag. The second run
# finds it present and stops on its own, but it should not be running in
# parallel while the first is mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish from the CHANGELOG
    # Only a green CI run releases anything.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fetch every tag — they are the input to the idempotency check — and
      # check out the commit CI actually validated. For a `workflow_run` event
      # the default branch tip is *not* necessarily that commit, and reading the
      # CHANGELOG from the wrong revision would derive the wrong version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Derive the release from the CHANGELOG
        id: plan
        run: node tools/release/plan-release.js --notes-out "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Summarize the plan
        env:
          # `${{ inputs.dry_run }}` renders a typed boolean as the text
          # "true"/"false", and is empty on a push, so the mode is decided by
          # comparing that text rather than by the expression language's
          # coercion of it against the boolean `true`.
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN_INPUT}" = "true" ]; then mode="dry run — nothing will be published"; else mode="publish"; fi
          {
            echo "### Release plan"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| derived tag | \`${{ steps.plan.outputs.tag }}\` |"
            echo "| releasable | \`${{ steps.plan.outputs.releasable }}\` |"
            echo "| notes | ${{ steps.plan.outputs.notes_chars }} characters |"
            echo "| commit | \`${{ github.event.workflow_run.head_sha || github.sha }}\` |"
            echo "| mode | $mode |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the tag and the release (or walk it on a dry run)
        # Runs whenever there is something to publish, including on a dry run:
        # the dry run takes the same path with a transport that sends nothing,
        # so what a release would do is visible before it does it.
        if: steps.plan.outputs.releasable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          # Anything that is not an explicit "true" publishes: a push carries no
          # input at all, while a manual run defaults to a dry run, so the
          # surprising case is the one that has to be asked for by name.
          flag=""
          if [ "${DRY_RUN_INPUT}" = "true" ]; then flag="--dry-run"; fi
          node tools/release/plan-release.js --publish $flag \
            --notes-out "$RUNNER_TEMP/release-notes.md" \
            --sha "${{ github.event.workflow_run.head_sha || github.sha }}"
